<mat-card class="post-card">

  <mat-card-header class="card-header-center">
    <mat-card-title class="post-title">
      Title: {{ post.title }}
    </mat-card-title>
<br>
<br>
    <mat-card-subtitle class="post-author">
      Author: <strong>{{ post.author }}</strong>
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="post-content">
    <p>Content: {{ post.content }}</p>
  </mat-card-content>

  <mat-card-actions class="d-flex justify-content-between">
    <button (click)="onEditPost()" mat-raised-button color="primary">
      Edit
    </button>

    <button (click)="onRemovePost()" mat-raised-button color="warn">
      Delete
    </button>
  </mat-card-actions>

</mat-card>
