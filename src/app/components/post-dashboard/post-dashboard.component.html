<div class="container post-dashboard">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-flex justify-content-center align-items-center mb-4 mt-4">
                <h1 class="mb-0 mr-4 font-weight-bold">
                    Blog Dashboard
                </h1>
                <button (click)="openPostForm()" mat-mini-fab color="primary">
                    <mat-icon>add</mat-icon>
                </button>
            </div>
            <ng-container *ngIf="posts.length > 0; else nopost">
                <app-post-card *ngFor="let post of posts" [post]="post" (postRemoved)="onPostRemoved($event)">
                </app-post-card>
            </ng-container>
            <ng-template #nopost>
                <p class="alert alert-info">No Blog is added Yet.. Plz add Blog..</p>
            </ng-template>
        </div>
    </div>
</div>
